					<main>

							<p><strong>API Key:</strong> <span id="currentKey">未配置</span></p>
							<p><strong>API Pass:</strong> <span id="currentPass">未配置</span></p>

	<script type="text/javascript" src="assets/lcars.js"></script>
	<script type="text/javascript" src="assets/lcars-ui.js"></script>
	<script type="text/javascript" src="assets/lcars-responsive.js"></script>
	<script type="text/javascript" src="assets/novel-api.js"></script>
	<script>
		/**
		 * This page writes the same credential keys as api-config.html, so it must
		 * go through NovelAPI rather than touching localStorage directly — otherwise
		 * the two entry points can disagree about what is stored.
		 */
		const STORAGE_KEY_APIKEY = 'lcars_novel_api_key';
		const STORAGE_KEY_APIPASS = 'lcars_novel_api_pass';
		const STORAGE_KEY_ENDPOINT = 'lcars_novel_api_endpoint';

		function setStatus(message, color) {
			var el = document.getElementById('connectionStatus');
			if (!el) { return; }
			el.textContent = message;
			el.style.color = color || '';
		}

		function saveAPIKey() {
			var keyInput = document.getElementById('apiKey');
			var passInput = document.getElementById('apiPass');
			var endpointInput = document.getElementById('apiEndpoint');

			var apiKey = keyInput ? keyInput.value.trim() : '';
			var apiPass = passInput ? passInput.value.trim() : '';
			var endpoint = endpointInput ? endpointInput.value.trim() : '';

			if (!apiKey) { alert('请输入 API Key'); if (keyInput) { keyInput.focus(); } return; }
			if (!apiPass) { alert('请输入 API Pass'); if (passInput) { passInput.focus(); } return; }

			if (!NovelAPI.saveCredentials(apiKey, apiPass, endpoint)) {
				alert('无法保存：浏览器拒绝了本地存储。请检查是否处于隐私模式或禁用了 Cookie。');
				return;
			}

			document.getElementById('currentKey').textContent = '已配置';
			document.getElementById('currentPass').textContent = '已配置';
			alert('API 配置保存成功');
		}

		function clearAPIKey() {
			NovelAPI.clearCredentials();

			var keyInput = document.getElementById('apiKey');
			var passInput = document.getElementById('apiPass');
			if (keyInput) { keyInput.value = ''; }
			if (passInput) { passInput.value = ''; }

			document.getElementById('currentKey').textContent = '未配置';
			document.getElementById('currentPass').textContent = '未配置';
			setStatus('未测试');
			alert('API 配置已清除');
		}

		/**
		 * Test the connection.
		 *
		 * The previous version assembled the full request URL and printed it — API
		 * pass included — into both the browser console and an alert(). The URL is
		 * never surfaced now, and the request inherits NovelAPI's timeout handling
		 * instead of passing a `timeout` option that fetch silently ignores.
		 */
		async function testAPIConnection() {
			var keyInput = document.getElementById('apiKey');
			var passInput = document.getElementById('apiPass');
			var endpointInput = document.getElementById('apiEndpoint');

			var apiKey = keyInput ? keyInput.value.trim() : '';
			var apiPass = passInput ? passInput.value.trim() : '';

			if (apiKey && apiPass) {
				NovelAPI.saveCredentials(apiKey, apiPass, endpointInput ? endpointInput.value.trim() : '');
			}

			if (!NovelAPI.hasCredentials()) {
				setStatus('未配置', '#c66');
				alert('请先配置 API Key 和 API Pass');
				return;
			}

			setStatus('测试中…', '#f96');

			var result = await NovelAPI.testConnection();

			if (result.success) {
				setStatus('已连接', '#6c6');
				var topic = (result.data && result.data.TopicInfo) || result.data || {};
				alert('API 连接测试成功\n\n端点: ' + NovelAPI.getAPIEndpoint() +
					'\n测试作品: ' + (topic.Title ? '《' + topic.Title + '》' : '(无标题)'));
			} else {
				setStatus('连接失败', '#c66');
				alert('API 连接测试失败\n\n' + result.error);
			}
		}

		document.addEventListener('DOMContentLoaded', function () {
			var creds = NovelAPI.getStoredCredentials();

			if (creds.apiKey) {
				document.getElementById('apiKey').value = creds.apiKey;
				document.getElementById('currentKey').textContent = '已配置';
			}
			if (creds.apiPass) {
				document.getElementById('apiPass').value = creds.apiPass;
				document.getElementById('currentPass').textContent = '已配置';
			}
			var endpointInput = document.getElementById('apiEndpoint');
			if (endpointInput) { endpointInput.value = NovelAPI.getAPIEndpoint(); }
		});
	</script>
